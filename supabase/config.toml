# Configuração do projeto Supabase. Só as edge functions do Stripe são
# declaradas aqui — o resto do projeto é gerenciado pelo Dashboard.

project_id = "rastahale"

# stripe-webhook é chamado pelo próprio Stripe (sem sessão de usuário),
# então precisa desativar a verificação de JWT.
[functions.stripe-webhook]
verify_jwt = false

# As demais funções exigem JWT (padrão), pois o cliente precisa estar logado.
[functions.create-checkout]
verify_jwt = true

[functions.create-portal]
verify_jwt = true

[functions.admin-sync-plan]
verify_jwt = true

# bunny-stream e admin-instructors validam a sessão por conta própria (ver o
# comentário no início de cada uma).
[functions.bunny-stream]
verify_jwt = false

[functions.admin-instructors]
verify_jwt = false

# Auth — URL de retorno dos emails (reset de senha, magic link) + valores
# restaurados do que existia no remoto antes do primeiro `supabase config push`
# (o comando reseta pra defaults do CLI tudo que nao esta explicitado).
[auth]
site_url = "https://www.rastahalevirtualacademy.com"
additional_redirect_urls = [
  "https://www.rastahalevirtualacademy.com/reset-senha",
  "https://www.rastahalevirtualacademy.com/**",
  "https://rastahalevirtualacademy.com/**",
  "https://localhost/reset-senha",
  "https://localhost/**",
  "http://localhost:8080/reset-senha",
  "http://localhost:8080/**"
]

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

# Storage vector buckets exigem paid tier; default do CLI e true e faz o push
# falhar com 402. Fixamos como false pra o config push ficar limpo.
[storage.vector]
enabled = false
