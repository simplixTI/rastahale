<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="55%" stop-color="#1a0f08"/>
      <stop offset="100%" stop-color="#2b1405"/>
    </linearGradient>

    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f58630" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#e85d0d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orangeText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb56b"/>
      <stop offset="100%" stop-color="#f58630"/>
    </linearGradient>

    <linearGradient id="beltGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f58630"/>
      <stop offset="100%" stop-color="#c9410a"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)"/>
  <rect width="1024" height="500" fill="url(#glow)"/>

  <!-- Diagonal stripes accent (top right) -->
  <g opacity="0.08" stroke="#f58630" stroke-width="2" fill="none">
    <line x1="700" y1="-50" x2="1100" y2="350"/>
    <line x1="730" y1="-50" x2="1130" y2="350"/>
    <line x1="760" y1="-50" x2="1160" y2="350"/>
    <line x1="790" y1="-50" x2="1190" y2="350"/>
  </g>

  <!-- Fighter silhouette (right side, abstract grappler) -->
  <g transform="translate(720, 90)" opacity="0.92">
    <!-- Back fighter (shadow) -->
    <g fill="#000000" opacity="0.5" filter="url(#soft)">
      <ellipse cx="140" cy="180" rx="120" ry="30"/>
    </g>

    <!-- Grappler figure -->
    <g fill="#1a0a03" stroke="#f58630" stroke-width="1.2">
      <!-- Torso -->
      <path d="M 90 90
               C 90 60, 130 55, 155 65
               L 200 80
               C 220 90, 225 120, 215 145
               L 190 175
               C 175 195, 145 200, 120 190
               L 95 175
               C 80 160, 82 130, 90 90 Z"/>
      <!-- Head -->
      <circle cx="140" cy="45" r="22"/>
      <!-- Arm reaching -->
      <path d="M 200 95
               C 235 100, 260 90, 275 75
               C 285 65, 288 55, 282 48
               C 275 42, 262 45, 252 55
               L 240 65"
            stroke-width="18" stroke-linecap="round" fill="none"/>
      <!-- Leg forward -->
      <path d="M 130 180
               C 125 210, 140 240, 165 250
               C 180 255, 195 250, 200 240"
            stroke-width="22" stroke-linecap="round" fill="none"/>
      <!-- Leg back -->
      <path d="M 105 175
               C 90 195, 75 220, 60 225"
            stroke-width="20" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Belt (orange) -->
    <rect x="88" y="128" width="132" height="16" rx="3" fill="url(#beltGrad)"/>
    <rect x="200" y="128" width="20" height="16" fill="#0d0d0d"/>
  </g>

  <!-- Left content block -->
  <g transform="translate(60, 130)">
    <!-- Small tag -->
    <g>
      <rect x="0" y="0" width="14" height="14" fill="#f58630"/>
      <text x="26" y="12" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffb56b" letter-spacing="3">
        STREAMING DE ARTES MARCIAIS
      </text>
    </g>

    <!-- Title -->
    <text x="0" y="80" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-2">
      RastaHale
    </text>
    <text x="0" y="150" font-family="Arial Black, Impact, sans-serif" font-size="72" font-weight="900" fill="url(#orangeText)" letter-spacing="-2">
      Academy
    </text>

    <!-- Underline accent -->
    <rect x="0" y="170" width="80" height="5" fill="#f58630"/>

    <!-- Tagline -->
    <text x="0" y="215" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#e8dcc8">
      Jiu-Jitsu Brasileiro &#8226; Luta Livre
    </text>
    <text x="0" y="245" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a89e8c">
      Aulas em vídeo do iniciante ao avançado.
    </text>
  </g>

  <!-- Bottom belts (levels) -->
  <g transform="translate(60, 425)">
    <rect x="0" y="0" width="70" height="8" rx="2" fill="#ffffff"/>
    <rect x="80" y="0" width="70" height="8" rx="2" fill="#4a7cd6"/>
    <rect x="160" y="0" width="70" height="8" rx="2" fill="#7a3f14"/>
    <rect x="240" y="0" width="70" height="8" rx="2" fill="#111111" stroke="#f58630" stroke-width="1"/>
    <text x="0" y="30" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="#a89e8c" letter-spacing="1">
      INICIANTE  &#8226;  INTERMEDIÁRIO  &#8226;  AVANÇADO
    </text>
  </g>
</svg>
