<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RastaHale Academy</title>
    <meta name="description" content="Plataforma de streaming educacional para Jiu-Jitsu Brasileiro e Luta Livre" />
    <meta name="author" content="RastaHale Academy" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme color (Android Chrome) -->
    <meta name="theme-color" content="#f97316" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RastaHale" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" href="/web-app-manifest-512x512.png" />

    <!-- Microsoft / PWA extra -->
    <meta name="msapplication-TileColor" content="#f97316" />
    <meta name="msapplication-TileImage" content="/favicon-96x96.png" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Tema: aplica a classe `light` antes do primeiro paint para evitar flash escuro -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("rasta_theme") || "light";
          var light = t === "light" || (t === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (light) document.documentElement.classList.add("light");
        } catch (e) {}
      })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RastaHale Academy" />
    <meta property="og:description" content="Plataforma de streaming educacional para Jiu-Jitsu e Luta Livre" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/CK9Yx0FRBXR5EHnVvHMOzyumKio2/social-images/social-1775109363119-unnamed.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RastaHale Academy" />
    <meta name="twitter:description" content="Plataforma de streaming educacional para Jiu-Jitsu e Luta Livre" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/CK9Yx0FRBXR5EHnVvHMOzyumKio2/social-images/social-1775109363119-unnamed.webp" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
